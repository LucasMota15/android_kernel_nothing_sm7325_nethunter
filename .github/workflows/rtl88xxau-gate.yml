name: RTL88XXAU Gate

on:
  workflow_dispatch:

jobs:
  rtl88xxau:
    name: Build RTL88XXAU against final Spacewar kernel config
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Free disk
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            wget \
            xz-utils

      - name: Cache AOSP Clang
        uses: actions/cache@v5
        with:
          path: /tmp/aosp-clang/clang-r547379
          key: aosp-clang-r547379-v1

      - name: Download AOSP Clang
        run: |
          mkdir -p /tmp/aosp-clang

          if [ ! -d /tmp/aosp-clang/clang-r547379/bin ]; then
            cd /tmp/aosp-clang

            wget -q \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r547379.tar.gz" \
              -O clang.tar.gz

            mkdir -p clang-r547379
            tar -xf clang.tar.gz -C clang-r547379
            rm clang.tar.gz
          fi

          /tmp/aosp-clang/clang-r547379/bin/clang --version | head -1

      - name: Configure final NetHunter kernel
        run: |
          export PATH=/tmp/aosp-clang/clang-r547379/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out

          make O=out vendor/lahaina-qgki_defconfig

          ./scripts/config --file out/.config \
            -e USB_ACM \
            -e USB_GADGET \
            -e USB_CONFIGFS \
            -e USB_CONFIGFS_SERIAL \
            -e USB_CONFIGFS_ACM \
            -e USB_CONFIGFS_OBEX \
            -e USB_CONFIGFS_NCM \
            -e USB_CONFIGFS_ECM \
            -e USB_CONFIGFS_ECM_SUBSET \
            -e USB_CONFIGFS_RNDIS \
            -e USB_CONFIGFS_EEM \
            -e USB_CONFIGFS_MASS_STORAGE \
            -e USB_CONFIGFS_F_HID \
            -e NETWORK_FILESYSTEMS \
            -e NFS_FS \
            -e NFS_V2 \
            -e NFS_V3 \
            -e NFS_V4 \
            -e NFSD \
            -e NFSD_V3 \
            -e NFSD_V4

          make O=out olddefconfig

      - name: Build kernel and in-tree modules
        run: |
          export PATH=/tmp/aosp-clang/clang-r547379/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out -j$(nproc) Image modules

          test -f out/arch/arm64/boot/Image
          test -f out/Module.symvers

          echo "Kernel: $(cat out/include/config/kernel.release)"
          echo "In-tree modules: $(find out -type f -name '*.ko' | wc -l)"

      - name: Clone and prepare aircrack-ng RTL8812AU driver
        run: |
          git clone \
            --depth 1 \
            --branch v5.6.4.2 \
            https://github.com/aircrack-ng/rtl8812au.git \
            external-rtl8812au

          git -C external-rtl8812au rev-parse HEAD

          echo "Removing Clang-incompatible GCC warning flag..."
          sed -i '/EXTRA_CFLAGS += -Wno-stringop-overread/d' \
            external-rtl8812au/Makefile

          echo "Verifying patch..."
          if grep -n -- '-Wno-stringop-overread' external-rtl8812au/Makefile; then
            echo "::error::-Wno-stringop-overread is still present in the driver Makefile"
            exit 1
          fi

          echo "::notice::RTL8812AU Makefile prepared for AOSP Clang"

      - name: Build RTL88XXAU module
        run: |
          export PATH=/tmp/aosp-clang/clang-r547379/bin:$PATH

          make \
            O="$GITHUB_WORKSPACE/out" \
            M="$GITHUB_WORKSPACE/external-rtl8812au" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_PLATFORM_I386_PC=n \
            CONFIG_PLATFORM_ANDROID_ARM64=y \
            CONFIG_88XXAU=m \
            -j$(nproc) \
            modules

          echo "=== Generated Realtek modules ==="
          find external-rtl8812au -type f -name '*.ko' -print

          test -f external-rtl8812au/88XXau.ko

      - name: Validate RTL88XXAU ABI
        run: |
          KERNEL_RELEASE="$(cat out/include/config/kernel.release)"
          MODULE="external-rtl8812au/88XXau.ko"

          echo "Kernel release:"
          echo "$KERNEL_RELEASE"

          echo
          echo "RTL88XXAU module:"
          file "$MODULE"

          echo
          echo "modinfo:"
          modinfo "$MODULE"

          VERMAGIC="$(modinfo -F vermagic "$MODULE")"

          echo
          echo "Kernel:   $KERNEL_RELEASE"
          echo "Vermagic: $VERMAGIC"

          if [[ "$VERMAGIC" != "$KERNEL_RELEASE"* ]]; then
            echo "::error::RTL88XXAU vermagic does not match kernel release"
            exit 1
          fi

          echo "::notice::RTL88XXAU compiled successfully and matches the Spacewar kernel"

      - name: Inspect monitor/injection support
        run: |
          MODULE="external-rtl8812au/88XXau.ko"

          strings "$MODULE" | grep -Ei \
            'monitor|injection|radiotap|cfg80211' \
            | head -n 100 \
            | tee rtl88xxau-capabilities.txt || true

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts

          cp external-rtl8812au/88XXau.ko artifacts/
          cp out/include/config/kernel.release artifacts/
          cp rtl88xxau-capabilities.txt artifacts/ || true

          modinfo external-rtl8812au/88XXau.ko \
            > artifacts/88XXau.modinfo.txt

          sha256sum artifacts/* \
            > artifacts/checksums.sha256

          {
            echo "# RTL88XXAU Gate"
            echo
            echo "**Kernel:** $(cat out/include/config/kernel.release)"
            echo
            echo "**88XXau.ko:** ✅"
            echo
            echo "**Vermagic:** $(modinfo -F vermagic external-rtl8812au/88XXau.ko)"
            echo
            echo "RTL88XXAU was built against the same kernel configuration used for the NetHunter candidate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RTL88XXAU artifact
        uses: actions/upload-artifact@v7
        with:
          name: spacewar-rtl88xxau-gate
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
